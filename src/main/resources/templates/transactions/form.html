<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>BudgetBook - Buchung Formular</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">

<h2 th:text="${transaction.id == null} ? 'Neue Buchung erstellen' : 'Buchung bearbeiten'">Formular</h2>

<form th:action="${transaction.id == null} ? @{/transactions} : @{/transactions/{id}(id=${transaction.id})}"
      th:object="${transaction}"
      method="post"
      class="mt-3">

    <div class="mb-3">
        <label for="amount" class="form-label">Betrag (€)</label>
        <input type="number" step="0.01" id="amount" th:field="*{amount}" class="form-control" th:classappend="${#fields.hasErrors('amount')} ? 'is-invalid'">
        <div class="invalid-feedback" th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}">Ungültiger Betrag</div>
    </div>

    <div class="mb-3">
        <label for="bookingDate" class="form-label">Datum</label>
        <input type="date" id="bookingDate" th:field="*{bookingDate}" class="form-control" th:classappend="${#fields.hasErrors('bookingDate')} ? 'is-invalid'">
        <div class="invalid-feedback" th:if="${#fields.hasErrors('bookingDate')}" th:errors="*{bookingDate}">Datum fehlt</div>
    </div>

    <div class="mb-3">
        <label for="type" class="form-label">Typ</label>
        <select id="type" th:field="*{type}" class="form-select" th:classappend="${#fields.hasErrors('type')} ? 'is-invalid'">
            <option value="">Bitte wählen...</option>
            <option value="INCOME">Einnahme (INCOME)</option>
            <option value="EXPENSE">Ausgabe (EXPENSE)</option>
        </select>
        <div class="invalid-feedback" th:if="${#fields.hasErrors('type')}" th:errors="*{type}">Typ wählen</div>
    </div>

    <div class="mb-3">
        <label for="categoryId" class="form-label">Kategorie</label>
        <select id="categoryId" th:field="*{category}" class="form-select" th:classappend="${#fields.hasErrors('categoryId')} ? 'is-invalid'">
            <option value="">Kategorie wählen...</option>
            <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}">Kategorie</option>
        </select>
        <div class="invalid-feedback" th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}">Kategorie fehlt</div>
    </div>

    <div class="mb-3">
        <label for="description" class="form-label">Beschreibung</label>
        <input type="text" id="description" th:field="*{description}" class="form-control" th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'">
        <div class="invalid-feedback" th:if="${#fields.hasErrors('description')}" th:errors="*{description}">Beschreibung prüfen</div>
    </div>

    <div> </div>

    <button type="submit" class="btn btn-success">Speichern</button>
    <a th:href="@{/transactions}" class="btn btn-secondary">Abbrechen</a>

</form>

</body>
</html>
